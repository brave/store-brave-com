minimumReleaseAge: 10080 # minutes; 7 days = 10080

blockExoticSubdeps: true

trustPolicy: "no-downgrade"
trustPolicyIgnoreAfter: 43200 # minutes; 30 days

publicHoistPattern:
  - "@prisma/client"
  - ".prisma"
  - "*keystone*"
  - "@keystone-6/*"
  - "react"
  - "react-dom"
  - "next"

overrides:
  esbuild@<=0.24.2: '>=0.25.0'
  fast-uri@>=3.0.0 <3.1.5: ^3.1.5
  file-type@>=13.0.0 <21.3.1: '>=21.3.1'
  postcss@<8.5.10: ^8.5.10
  postcss@<=8.5.11: ^8.5.12
  postcss@<=8.5.17: ^8.5.18
  postcss@<=8.5.22: ^8.5.23
  sharp@<0.35.0: ^0.35.0
  uuid@<11.1.1: ^11.1.1
  next@<15.5.24: 15.5.24

verifyDepsBeforeRun: install

allowBuilds:
  '@apollo/protobufjs': false
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: false
  prisma: true
  sharp: false

engineStrict: true

minimumReleaseAgeExclude:
  - fast-uri@3.1.5
  - '@next/env@15.5.24'
  - '@next/swc-darwin-arm64@15.5.24'
  - '@next/swc-darwin-x64@15.5.24'
  - '@next/swc-linux-arm64-gnu@15.5.24'
  - '@next/swc-linux-arm64-musl@15.5.24'
  - '@next/swc-linux-x64-gnu@15.5.24'
  - '@next/swc-linux-x64-musl@15.5.24'
  - '@next/swc-win32-arm64-msvc@15.5.24'
  - '@next/swc-win32-x64-msvc@15.5.24'
  - next@15.5.24

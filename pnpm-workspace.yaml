minimumReleaseAge: 10080 # minutes; 7 days = 10080

blockExoticSubdeps: true

trustPolicy: "no-downgrade"
trustPolicyIgnoreAfter: 43200 # minutes; 30 days

allowBuilds:
  "@brave/leo@https://codeload.github.com/brave/leo/tar.gz/55d9ea6e182df22dc046f693576c499aec25166d": true
  '@parcel/watcher': false
  esbuild: false
  svelte-preprocess: false

publicHoistPattern:
  - "graphql-tag"

overrides:
  '@graphql-tools/utils@<=12.0.0': ^12.0.1
  '@storybook/core@>=8.0.0 <8.6.19': ^8.6.19
  cookie@<0.7.0: ^0.7.0
  postcss-selector-parser@<7.1.6: ^7.1.6

verifyDepsBeforeRun: install

engineStrict: true
